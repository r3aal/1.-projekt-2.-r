<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <script src="node_modules/tom-select/dist/js/tom-select.complete.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <!-- navbar -->
    <nav class="navbar navbar-expand-sm shadow-sm py-3" style="background-color: #e8c8a8;">
        <div class="container-fluid px-4">
            <!-- logo -->
            <a class="navbar-brand fw-bold fs-4 text-dark d-flex align-items-center gap-2 me-4" href="index.html">
                <i id="candy-icon" class="fa-solid fa-cookie-bite"
                    style="color: rgb(91, 62, 11); cursor: pointer; font-size: 1.8rem;"></i>
                Perličky
            </a>

            <!-- tlacitko pro mobil (hamburger) -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- skladaci menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-semibold px-3 text-secondary"
                            href="index2.html">Produkty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-bold px-3 text-dark" href="index3.html">Dotazy a zájmy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-semibold px-3 text-secondary"
                            href="index4.html">Kontakty</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- progress bar -->
    <div class="container my-4" style="max-width: 1000px;">
        <div class="progress shadow-sm rounded-pill" style="background-color: #ffffff; height: 24px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated rounded-pill text-dark fw-bold"
                role="progressbar" style="width: 100%; background-color: #e8c8a8; text-align: center; line-height: 24px;"
                aria-valuenow="15" aria-valuemin="0" aria-valuemax="100">
                hotovo
            </div>
        </div>
    </div>

    <!-- formular -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <h2 class="fw-bold mb-4 text-center text-dark">Dotazy a zájmy</h2>

                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <form action="/action_page.php">

                        <!-- email -->
                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold text-dark">Emailová adresa:</label>
                            <input type="email" class="form-control rounded-3 p-3" id="email"
                                placeholder="Napište váš email (např. jan@example.cz)" name="email" required>
                        </div>

                        <!-- vyberove pole -->
                        <div class="mb-4">
                            <label for="topics" class="form-label fw-semibold text-dark">Téma dotazu / Zájmy:</label>
                            <select id="topics" name="topics[]" multiple required placeholder="Vyberte...">
                                <option value="perlicky">Dotaz k produktům Perliček</option>
                                <option value="objednavky">Stav mé objednávky</option>
                                <option value="velkoobchod">Velkoobchodní spolupráce</option>
                                <option value="reklamace">Reklamace a vrácení zboží</option>
                                <option value="ostatni">Ostatní dotazy</option>
                            </select>
                        </div>

                        <!-- textove pole -->
                        <div class="mb-4">
                            <label for="comment" class="form-label fw-semibold text-dark">Zpráva nebo dotaz:</label>
                            <textarea class="form-control rounded-3 p-3" rows="5" id="comment"
                                placeholder="Napište nám vaši zprávu..." name="text"></textarea>
                        </div>

                        <!-- tlacitko odelsani -->
                        <div class="text-center text-md-start">
                            <button type="submit" class="btn text-dark fw-bold rounded-pill px-4 py-2 shadow-sm"
                                style="background-color: #e8c8a8; border-color: #e8c8a8;">
                                Odeslat zprávu
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- paticka -->
    <footer class="py-3 py-md-4 text-center mt-auto" style="background-color: #e8c8a8;">
        <div class="container px-3">
            <a href="dokumentace/Dokumentace projektu.pdf"
                class="text-dark fw-bold text-decoration-none d-inline-block py-2 px-3 text-break fs-6 fs-md-5">
                <i class="fa-solid fa-file-pdf me-2"></i>Odkaz na PDF s dokumentací
            </a>
        </div>
    </footer>

    <!-- editor pro textove pole -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

    <script>
        // tom select
        new TomSelect('#topics', {
            plugins: {
                remove_button: {
                    title: 'Odebrat položku'
                }
            },
            placeholder: 'Vyberte...',
            hideSelected: true
        });

        // vetsi vyska u text. pole
        ClassicEditor
            .create(document.querySelector('#comment'))
            .then(editor => {
                editor.editing.view.change(writer => {
                    writer.setStyle('min-height', '200px', editor.editing.view.document.getRoot());
                });
            })
            .catch(error => {
                console.error('Chyba při načítání WYSIWYG editoru:', error);
            });
    </script>

</body>

</html>
