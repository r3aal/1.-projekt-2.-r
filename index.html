<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <script src="node_modules/tom-select/dist/js/tom-select.complete.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body class="bg-body-tertiary">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-sm bg-white shadow-sm py-3">
        <div class="container-fluid px-4">
            <!-- Logo -->
            <a class="navbar-brand fw-bold fs-4 text-dark d-flex align-items-center gap-2 me-4" href="index.html">
                <i id="candy-icon" class="fa-solid fa-cookie-bite"
                    style="color: rgb(91, 62, 11); cursor: pointer; font-size: 1.8rem;"></i>
                Perličky
            </a>

            <!-- Tlačítko pro mobil (Hamburger) -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Skládací menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-semibold px-3 text-secondary" href="index2.html">Produkty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-semibold px-3 text-secondary" href="index3.html">Objednávky</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-uppercase fw-semibold px-3 text-secondary" href="index4.html">Kontakty</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- PROGRESS BAR (15 %) -->
    <div class="container my-4" style="max-width: 1000px;">
        <div class="progress shadow-sm rounded-pill" style="background-color: #ffffff; height: 24px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated rounded-pill text-dark fw-bold" 
                 role="progressbar" 
                 style="width: 15%; background-color: #ffbff3; text-align: center; line-height: 24px;"
                 aria-valuenow="15" aria-valuemin="0" aria-valuemax="100">
                15%
            </div>
        </div>
    </div>

    <!-- CAROUSEL -->
    <div class="container my-5" style="max-width: 1000px;">
        <div id="demo" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators/dots -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active bg-dark"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1" class="bg-dark"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2" class="bg-dark"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="3" class="bg-dark"></button>
            </div>

            <!-- Slideshow -->
            <div class="carousel-inner rounded-4 shadow-lg">
                <div class="carousel-item active">
                    <img src="#" alt="placeholder" class="d-block w-100 object-fit-cover" style="height: 400px;">
                </div>
                <div class="carousel-item">
                    <img src="#" alt="placeholder" class="d-block w-100 object-fit-cover" style="height: 400px;">
                </div>
                <div class="carousel-item">
                    <img src="#" alt="placeholder" class="d-block w-100 object-fit-cover" style="height: 400px;">
                </div>
                <div class="carousel-item">
                    <img src="#" alt="placeholder" class="d-block w-100 object-fit-cover" style="height: 400px;">
                </div>
            </div>

            <!-- Left and right controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Předchozí</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Další</span>
            </button>
        </div>
    </div>

</body>

</html>
